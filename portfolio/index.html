  <script>
    // Resolve the theme before first paint, otherwise a dark-mode visitor gets a flash of
    // parchment. An explicit choice wins over the OS preference; ThemeToggle keeps both
    // the attribute and the stored value in sync from here on.
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (e) { /* private mode */ }
      var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = dark ? '#1c1411' : '#efe9df';
    })();
  </script>

  <script>
    // 404.html bounces deep links back here as /?redirect=/about — restore the real URL
    // before React Router reads it. Also catches links to the old /#/about hash routes.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var target = params.get('redirect');
      if (!target && window.location.hash.indexOf('#/') === 0) target = window.location.hash.slice(1);
      if (target) window.history.replaceState(null, '', target);
    })();
  </script>
